<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SIH 26143: oil spill detection, drift reconstruction and vessel attribution from static precomputed data." />
    <title>Oil spill investigation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B5FA5'/%3E%3Cpath d='M6 20c4-6 8 2 12-3s6-2 8-1' stroke='%23D55181' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M9 12l7-4 7 4' stroke='%23E8EFF2' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint. Storage can be unavailable; fall back to light (day).
      (function () {
        var t = "day";
        try { t = localStorage.getItem("oilspill.theme") || "day"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t === "night" ? "night" : "day");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
